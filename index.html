<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Momentum</title>
<meta name="description" content="Daily writing tracker: word totals, streaks, projects and trophies.">
<meta name="theme-color" content="#f3f6fa" id="themeColor">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Momentum">
<meta name="apple-mobile-web-app-status-bar-style" content="default" id="statusBar">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one-screen phone app — scrolling view area over a fixed bottom tab bar; colors switch day/night by the clock */
:root{
  --bg:#f3f6fa; --surface:#ffffff; --ink:#0f1720; --muted:#5b6b7d; --line:#dde4ec;
  --field:#f6f8fb; --fieldline:#cdd6e0; --track:#e6ecf2;
  --blue:#1083fe; --blue-ink:#0a66d6; --blue-tint:#e3f0ff; --on-blue:#ffffff;
  --gold:#f5b83d; --gold-ink:#8a5a06; --gold-tint:#fdf3dc;
  --silver:#b9c3ce; --silver-ink:#4f5d6c; --silver-tint:#eef2f6;
  --pink:#ff4f8b; --pink-ink:#b81f5a; --pink-tint:#ffe3ee;
  --band:#161e27; --band-ink:#f1f3f5; --band-muted:#8b98a9; --band-track:#2c3a4b;
  --glow:rgba(16,131,254,0.12); --scrim:rgba(15,23,32,0.45);
  --sans:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme:light;
}
:root.night{
  --bg:#161e27; --surface:#1e2936; --ink:#f1f3f5; --muted:#8b98a9; --line:#2c3a4b;
  --field:#161e27; --fieldline:#34465b; --track:#253242;
  --blue:#1083fe; --blue-ink:#4ba3ff; --blue-tint:#1b3350; --on-blue:#ffffff;
  --gold:#f5b83d; --gold-ink:#f5c463; --gold-tint:#3a3220;
  --silver:#c3ccd6; --silver-ink:#d5dce4; --silver-tint:#2a3442;
  --pink:#ff4f8b; --pink-ink:#ff8fb1; --pink-tint:#3e2430;
  --band:#1e2936; --band-ink:#f1f3f5; --band-muted:#8b98a9; --band-track:#34465b;
  --glow:rgba(16,131,254,0.16); --scrim:rgba(0,0,0,0.55);
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;transition:background-color .6s,color .6s}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
html,button,a,input,select,textarea,label{touch-action:manipulation}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;max-width:460px;margin:0 auto;position:relative;background-image:radial-gradient(circle at 50% 34%,var(--glow),transparent 46%)}
main{flex:1 1 auto;overflow-y:auto;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:10px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.band{background:var(--band);color:var(--band-ink);border-radius:14px;padding:12px 14px}
.band .label,.band .sub{color:var(--band-muted)}
.row{display:flex;align-items:center;gap:8px}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{display:flex;flex-direction:column;gap:1px;min-width:0}
.stat b{font-family:var(--mono);font-weight:600;font-size:17px}
.stat .sub{font-size:11px}
.field{font-size:16px;height:40px;border:1px solid var(--fieldline);border-radius:9px;background:var(--field);padding:0 10px;min-width:0}
textarea.field{height:auto;min-height:44px;padding:8px 10px;resize:vertical;width:100%}
.btn{height:40px;padding:0 16px;border:1px solid var(--fieldline);border-radius:10px;background:var(--surface);font-weight:700;font-size:14px}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--on-blue);font-weight:800}
.btn.quiet{border-color:transparent;background:none;color:var(--muted)}
.btn.danger{border-color:transparent;background:none;color:var(--pink-ink)}
.iconbtn{width:40px;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--surface);display:grid;place-items:center;padding:0;flex:0 0 auto}
.iconbtn svg{stroke:var(--ink)}
.bar{height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--blue);border-radius:3px}
h1,h2{margin:0;font-weight:800;text-wrap:balance}
h1{font-size:23px;line-height:1.15}
h2{font-size:17px}
.eyebrow{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.08em}

/* Today */
.ringwrap{display:flex;flex-direction:column;align-items:center;gap:2px}
.ring{position:relative;width:140px;max-width:100%;aspect-ratio:1;height:auto;container-type:inline-size}
#ringArt,#ringArt svg{width:100%;height:100%}
.ring svg{display:block}
.ring circle{transition:stroke-dasharray .45s ease}
.streakbtn{position:absolute;inset:13%;border-radius:50%;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0}
.streakbtn .n{font-family:var(--mono);font-size:44px;font-size:clamp(30px,28cqw,56px);font-weight:600;line-height:1}
.streakbtn .t{font-size:12px;font-weight:700;color:var(--muted)}
.pill{white-space:nowrap;font-size:11px;font-weight:800;color:var(--blue-ink);background:var(--blue-tint);border-radius:999px;padding:3px 9px}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;font-size:11px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.big-input{height:44px;font-family:var(--mono);font-size:22px;font-weight:600;border:1.5px solid var(--blue);width:100%}
.trophy-link.silver{border-color:var(--silver);background:var(--silver-tint)}
.trophy-link.silver .cup{border-color:var(--silver)}.trophy-link.silver .cup svg{stroke:var(--silver-ink)}
.trophy-link.silver .gold-bar{background:color-mix(in srgb,var(--silver) 35%,transparent)}.trophy-link.silver .gold-bar>span{background:var(--silver)}
[data-act="tro"]{cursor:pointer}
.log{list-style:none;margin:0;padding:0;max-height:46vh;overflow-y:auto;display:flex;flex-direction:column}
.log li{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.log li:last-child{border-bottom:0}
.log b{font-size:14px}
.log .p{font-size:12px;color:var(--muted)}
.log .r{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right;flex:0 0 auto}
.gems{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.gem{border:1.5px dashed var(--fieldline);border-radius:12px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;text-align:center;background:var(--surface)}
.gem b{font-size:11px;line-height:1.2}
.gem span{font-size:10px;color:var(--muted)}
.gem.got{border-style:solid;border-color:var(--gold);background:var(--gold-tint)}
.gem.got span{color:var(--gold-ink)}
.medal{display:flex;align-items:center;gap:10px;min-width:0}
.medal i{width:46px;height:46px;flex:0 0 auto;border-radius:13px;display:grid;place-items:center}
.medal b{font-family:var(--mono);font-size:28px;font-weight:600;line-height:1}
.trophy-link{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1.5px solid var(--gold);background:var(--gold-tint);border-radius:14px;padding:10px 12px;color:var(--ink)}
.cup{width:44px;height:44px;flex:0 0 auto;border-radius:12px;background:var(--surface);border:1.5px solid var(--gold);display:grid;place-items:center}
.cup svg{stroke:var(--gold-ink)}
.gold-bar{height:6px;border-radius:3px;background:color-mix(in srgb,var(--gold) 28%,transparent);overflow:hidden}
.gold-bar>span{display:block;height:100%;background:var(--gold)}

/* Calendar */
.dows,.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.dows span{text-align:center;font-size:11px;font-weight:700;color:var(--muted)}
.day{height:var(--cell,40px);max-width:100%;border-radius:9px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;font-family:var(--mono);font-size:13px;line-height:1.15;position:relative}
.day small{font-size:9px;opacity:.85}
.day .nt{position:absolute;top:4px;right:5px;width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.7}
.day.part{background:var(--blue-tint);border-color:var(--blue-tint)}
.day.met{background:var(--blue);border-color:var(--blue);color:#ffffff}
.day.double{background:var(--gold);border-color:var(--gold);color:#161e27}
.day.beyond{background:var(--pink);border-color:var(--pink);color:#161e27}
.day.miss{background:repeating-linear-gradient(135deg,var(--track) 0 5px,transparent 5px 9px);color:var(--muted);border:1px dashed var(--muted)}
.day.pending{border:1.5px dashed var(--blue)}
.day.future,.day.before{background:transparent;color:var(--muted);opacity:.6}
.day.today{box-shadow:0 0 0 2px var(--ink)}
.day.sel{outline:2.5px solid var(--blue-ink);outline-offset:2px}
.day.blank{visibility:hidden}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

/* Projects */
.proj{display:flex;flex-direction:column;gap:10px}
.proj.current{border:1.5px solid var(--blue);box-shadow:0 6px 18px var(--glow)}
.chip{font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--on-blue);background:var(--blue);border-radius:999px;padding:3px 9px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form label{display:flex;flex-direction:column;gap:4px;min-width:0}
.form .full{grid-column:1/-1}
.add-slot{border:1.5px dashed var(--fieldline);border-radius:14px;background:transparent;padding:16px;font-weight:800;display:flex;flex-direction:column;gap:2px;align-items:center}

/* Trophies */
.shelf{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.mini{display:flex;flex-direction:column;gap:6px;padding:10px 12px}
.push{margin-top:auto}
.tro{min-height:var(--tile,74px);justify-content:center;border:1.5px dashed var(--fieldline);border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;background:var(--surface)}
.tro svg{stroke:var(--muted)}
.tro b{font-size:13px;line-height:1.2}
.tro span{font-size:11px;color:var(--muted)}
.tro.got{border-style:solid;border-color:var(--gold);background:var(--gold-tint)}
.tro.got svg{stroke:var(--gold-ink)}
.tro.got span{color:var(--gold-ink)}

/* Tabs */
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border-top:1px solid var(--line);padding:6px max(10px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:700;color:var(--muted)}
.tabs button svg{stroke:currentColor}
.tabs button[aria-current="page"]{color:var(--blue-ink)}

/* Sheet + toast */
.sheet{position:absolute;inset:0;background:var(--scrim);display:flex;flex-direction:column;z-index:10}
.sheet .away{flex:1 1 auto;border:0;background:transparent}
.sheet .panel{background:var(--surface);border-radius:22px 22px 0 0;padding:12px 20px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--fieldline);align-self:center}
.seg{height:60px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0}
.seg[aria-pressed="true"]{border:1.5px solid var(--blue);background:var(--blue-tint)}
.seg b{font-family:var(--mono);font-size:16px;font-weight:600}
.seg span{font-size:12px;font-weight:700}
.tint{border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px}
.tint span{font-size:11px;font-weight:700}
.tint b{font-family:var(--mono);font-size:18px;font-weight:600}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:700;max-width:calc(100% - 32px);z-index:20;text-align:center}
.note{font-size:12px;color:var(--muted);text-align:center;margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div class="app" id="app">
  <main id="view" aria-live="polite"><p class="note">Loading your ledger…</p></main>
  <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  <div class="sheet" id="sheet" hidden></div>
  <div class="toast" id="toast" hidden></div>
</div>

<script>
(function(){
  "use strict";
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2,"0");
  const key = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
  const parse = k => { const [y,m,d]=k.split("-").map(Number); return new Date(y,m-1,d); };
  const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
  const diff = (a,b) => Math.round((parse(b)-parse(a))/864e5);
  const fmt = n => Math.round(n).toLocaleString("en-US");
  const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const MON=["January","February","March","April","May","June","July","August","September","October","November","December"];
  const DOW=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const short = k => { const d=parse(k); return MON[d.getMonth()].slice(0,3)+" "+d.getDate(); };
  const STAGES=["Planning","Drafting","Revising","Editing","Querying","Done"];
  const CUP='<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M17 5h3v2a3 3 0 0 1-3 3"/><path d="M7 5H4v2a3 3 0 0 0 3 3"/></svg>';
  const ICON={
    today:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg>',
    calendar:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>',
    projects:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4h9l3 3v13H6z"/><path d="M9 11h6M9 15h6"/></svg>',
    trophies:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v5a5 5 0 0 1-10 0V4z"/></svg>',
    sun:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    moon:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>',
    left:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>',
    right:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>',
    edit:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg>',
    close:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>'
  };

  // ---------- state ----------
  let today=new Date(); today.setHours(0,0,0,0);
  let todayK=key(today);
  let days={};            // "YYYY-MM-DD" -> {words, goal, project, note}
  let settings=defaults();
  let view="today", calSel=todayK, calY=today.getFullYear(), calM=today.getMonth();
  let completing=null;
  let sheetKind="rates";
  let sheetRange="week", editingProj=null, armedDelete=false, pendingRestore=null;
  let store=null;

  function defaults(){
    return {goal:500, start:key(new Date()), current:"cn", projects:[
      {id:"cn", name:"Corporation Nation", target:0, deadline:"", stage:"Drafting"},
      {id:"ubiz", name:"Unfinished Business", target:0, deadline:"", stage:"Revising"}
    ]};
  }
  function normSettings(s){
    const o=Object.assign(defaults(), s||{});
    if(!Array.isArray(o.projects)) o.projects=defaults().projects;
    o.projects=o.projects.map(p=>({id:String(p.id), name:String(p.name||"Untitled"), target:+p.target||0, deadline:p.deadline||"",
      stage:STAGES.includes(p.stage)?p.stage:(p.id==="ubiz"?"Revising":"Drafting"),
      completedAt:p.completedAt||"", draftDoneAt:p.draftDoneAt||"", revDoneAt:p.revDoneAt||"", draftWords:+p.draftWords||0,
      revision:p.revision?{cutGoal:+p.revision.cutGoal||0, chapterGoal:+p.revision.chapterGoal||0, dailyCut:+p.revision.dailyCut||0, dailyChapters:+p.revision.dailyChapters||0, startedAt:p.revision.startedAt||""}:null}));
    if(!o.projects.some(p=>p.id===o.current)) o.current=o.projects[0]?o.projects[0].id:"";
    o.goal=+o.goal>0?+o.goal:500;
    return o;
  }
  function normDay(v){
    v=v||{};
    if(Array.isArray(v.items)){ // earlier version: several entries per day
      let w=0, best={}, p=""; v.items.forEach(i=>{ w+=+i.w||0; best[i.p||""]=(best[i.p||""]||0)+(+i.w||0); });
      let m=-1; for(const k in best) if(best[k]>m){m=best[k];p=k;}
      return {words:w, goal:+v.goal||0, project:p, note:v.note||"", cut:0, chapters:0, rev:null};
    }
    return {words:+v.words||0, goal:+v.goal||0, project:v.project||"", note:v.note||"", cut:+v.cut||0, chapters:+v.chapters||0,
      rev:v.rev&&(+v.rev.cut>0||+v.rev.ch>0)?{cut:+v.rev.cut||0, ch:+v.rev.ch||0}:null};
  }

  // ---------- derived ----------
  const W = k => days[k] ? days[k].words : 0;
  const G = k => (days[k] && days[k].goal) || settings.goal;
  const CUT = k => days[k] ? (days[k].cut||0) : 0;
  const CH = k => days[k] ? (days[k].chapters||0) : 0;
  const logged = d => d && (d.words>0 || d.cut>0 || d.chapters>0);
  // a day's progress as a multiple of its target: new words, or revision work on revision days
  function revRatio(cut,ch,t){ if(!t) return 0; return Math.max(t.cut>0?cut/t.cut:0, t.ch>0?ch/t.ch:0); }
  function ratioOf(d){ if(!d) return 0; return Math.max((d.words||0)/(d.goal||settings.goal), revRatio(d.cut||0,d.chapters||0,d.rev)); }
  const R = k => ratioOf(days[k]);
  function tierR(r){ if(r>=3) return "beyond"; if(r>=2) return "double"; if(r>=1) return "met"; if(r>0) return "part"; return "none"; }
  const projOf = id => settings.projects.find(p=>p.id===id);
  const revTarget = p => p && p.stage==="Revising" && p.revision && (p.revision.dailyCut>0||p.revision.dailyChapters>0) ? {cut:p.revision.dailyCut, ch:p.revision.dailyChapters} : null;
  function startKey(){ let s=settings.start||todayK; for(const k in days) if(k<s && logged(days[k])) s=k; return s; }
  function tierOf(w,g){ if(w>=3*g) return "beyond"; if(w>=2*g) return "double"; if(w>=g) return "met"; if(w>0) return "part"; return "none"; }
  function status(k){
    if(k>todayK) return "future";
    const t=tierR(R(k));
    if(t!=="none") return t;
    if(k===todayK) return "pending";
    return k<startKey() ? "before" : "miss";
  }
  const met = k => R(k)>=1;
  function streak(){
    const s=startKey(); let n=0, d=met(todayK)?new Date(today):addDays(today,-1);
    while(key(d)>=s && met(key(d))){ n++; d=addDays(d,-1); }
    return n;
  }
  function runs(){
    const s=startKey(), out=[]; let r=0;
    for(let d=parse(s); key(d)<=todayK; d=addDays(d,1)){
      const k=key(d);
      if(met(k)) r++; else { if(k===todayK) break; if(r) out.push(r); r=0; }
    }
    if(r) out.push(r);
    return out;
  }
  function rate(range){
    const s=startKey();
    let from = range==="year" ? key(new Date(today.getFullYear(),0,1)) : key(addDays(today, range==="week"?-6:-29));
    if(from<s) from=s;
    let days_=0,m=0,dbl=0,bey=0;
    for(let d=parse(from); key(d)<=todayK; d=addDays(d,1)){
      const k=key(d), r=R(k);
      if(k===todayK && r<1) continue;
      days_++; if(r>=1)m++; if(r>=2)dbl++; if(r>=3)bey++;
    }
    return {days:days_, met:m, dbl, bey, pct: days_?Math.round(100*m/days_):null, from, to: met(todayK)?todayK:key(addDays(today,-1))};
  }
  function yearStats(){
    const y=String(today.getFullYear()); let w=0,written=0,hit=0;
    for(const k in days) if(k.startsWith(y)){ const x=days[k]; w+=x.words; if(logged(x)) written++; if(R(k)>=1) hit++; }
    return {w,written,hit};
  }
  function totalWords(){ let t=0; for(const k in days) t+=days[k].words; return t; }
  function projTotals(year){
    const t={}; for(const k in days){ if(year && !k.startsWith(year)) continue; const p=days[k].project||""; t[p]=(t[p]||0)+days[k].words; } return t;
  }
  function projRev(pid){
    let cut=0, ch=0, first=null, ch14=0; const from14=key(addDays(today,-13));
    for(const k in days){ const x=days[k]; if(x.project!==pid || !(x.cut>0||x.chapters>0)) continue; cut+=x.cut||0; ch+=x.chapters||0; if(!first||k<first) first=k; if(k>=from14) ch14+=x.chapters||0; }
    let span=first ? diff(first<from14?from14:first, todayK)+1 : 0;
    return {cut, ch, chPace: span? ch14/span : 0};
  }
  function projPace(pid){
    let first=null; for(const k in days) if(days[k].project===pid && days[k].words>0 && (!first||k<first)) first=k;
    if(!first) return 0;
    let from=key(addDays(today,-13)); if(from<first) from=first;
    let sum=0; for(let d=parse(from); key(d)<=todayK; d=addDays(d,1)){ const x=days[key(d)]; if(x && x.project===pid) sum+=x.words; }
    return sum/(diff(from,todayK)+1);
  }
  const STREAK_TROPHIES=[[7,"Week"],[30,"Month"],[60,"2 months"],[90,"3 months"],[180,"6 months"],[365,"Year"]];
  // rarer trophies for words written inside one unbroken streak: a gold cup holding a gem
  const GEMS=[
    {at:10000,  name:"Emerald",  color:"#1fbf7a"},
    {at:25000,  name:"Sapphire", color:"#2f6bff"},
    {at:50000,  name:"Ruby",     color:"#e8264f"},
    {at:75000,  name:"Amethyst", color:"#9b4dff"},
    {at:100000, name:"Diamond",  color:"#bfefff"}
  ];
  // every trophy moment, with the day it happened and the project you were on
  function trophyLog(){
    const L={silver:[],gold:[],gem:{},streak:{}};
    GEMS.forEach(g=>L.gem[g.at]=[]); STREAK_TROPHIES.forEach(([n])=>L.streak[n]=[]);
    let total=0, ns=5000, run=0, rw=0, ng=5000, gemDone={};
    for(let d=parse(startKey()); key(d)<=todayK; d=addDays(d,1)){
      const k=key(d), w=W(k), p=days[k]?days[k].project:"";
      total+=w; while(total>=ns){ L.silver.push({k,p,txt:fmt(ns)+" words total"}); ns+=5000; }
      if(met(k)){
        run++; rw+=w;
        while(rw>=ng){ L.gold.push({k,p,txt:fmt(ng)+" words · day "+run+" of streak"}); ng+=5000; }
        GEMS.forEach(g=>{ if(rw>=g.at && !gemDone[g.at]){ gemDone[g.at]=1; L.gem[g.at].push({k,p,txt:"day "+run+" of streak"}); } });
        STREAK_TROPHIES.forEach(([n])=>{ if(run===n) L.streak[n].push({k,p,txt:fmt(rw)+" words in streak"}); });
      } else if(k!==todayK){ run=0; rw=0; ng=5000; gemDone={}; }
    }
    return L;
  }
  const longDate = k => { const d=parse(k); return MON[d.getMonth()].slice(0,3)+" "+d.getDate()+", "+d.getFullYear(); };
  const projName = id => id ? ((projOf(id)||{}).name || "Removed project") : "No project";
  function troSheet(id){
    const L=trophyLog(); let title, desc, icon, items=[], how;
    const silverCup=CUP.replace('width="24" height="24"','width="30" height="30" stroke="#161e27"');
    if(id==="silver"){ title="Silver trophies"; desc="One for every 5,000 words you write."; icon='<i style="background:var(--silver)">'+silverCup+'</i>'; items=L.silver; how="Write 5,000 words in total."; }
    else if(id==="gold"){ title="Gold trophies"; desc="5,000 words inside one unbroken streak."; icon='<i style="background:var(--gold)">'+silverCup+'</i>'; items=L.gold; how="Write 5,000 words without missing your daily target."; }
    else if(id.startsWith("gem:")){ const g=GEMS.find(x=>x.at===+id.slice(4)); title=g.name+" trophy"; desc=fmt(g.at)+" words inside one unbroken streak."; icon='<i style="background:var(--gold-tint)">'+gemCup(g.color,40,false)+'</i>'; items=L.gem[g.at]; how="Write "+fmt(g.at)+" words in a single streak."; }
    else if(id.startsWith("streak:")){ const n=+id.slice(7), s=STREAK_TROPHIES.find(x=>x[0]===n); title=s[1]+" streak"; desc=n+" days in a row on target."; icon='<i style="background:var(--gold)">'+silverCup+'</i>'; items=L.streak[n]; how="Hit your target "+n+" days in a row."; }
    else if(id==="draft"||id==="rev"){
      const f=id==="draft"?"draftDoneAt":"revDoneAt"; title=id==="draft"?"Draft done":"Revision done";
      desc=id==="draft"?"Finished a draft.":"Finished a revision."; icon='<i style="background:var(--gold)">'+silverCup+'</i>';
      items=settings.projects.filter(p=>p[f]).map(p=>({k:p[f],p:p.id,txt:id==="draft"?fmt(p.draftWords||0)+" words":p.stage}));
      how=id==="draft"?"Tap Mark draft complete on a project.":"Tap Revision complete on a project in revision.";
    }
    items=items.slice().sort((a,b)=>a.k<b.k?1:a.k>b.k?-1:0);
    const list = items.length
      ? '<ul class="log">'+items.map(e=>'<li><span><b>'+longDate(e.k)+'</b><br><span class="p">'+esc(projName(e.p))+'</span></span><span class="r">'+esc(e.txt)+'</span></li>').join("")+'</ul>'
      : '<p class="muted" style="margin:0">Not earned yet. '+how+'</p>';
    return '<button class="away" data-act="closesheet" aria-label="Close"></button>'+
      '<div class="panel" role="dialog" aria-label="'+esc(title)+'"><span class="grab"></span>'+
      '<div class="between"><div class="medal">'+icon+'<div class="stat"><h2 style="font-size:20px">'+esc(title)+'</h2><span class="muted" style="font-size:13px">'+esc(desc)+'</span></div></div>'+
      '<button class="iconbtn" data-act="closesheet" aria-label="Close">'+ICON.close+'</button></div>'+
      (items.length?'<span class="label">Earned '+items.length+' time'+(items.length===1?'':'s')+' · newest first</span>':'')+
      list+'</div>';
  }
  function gemCup(color, size, locked){
    const cup=locked?"var(--fieldline)":"#f5b83d", line=locked?"var(--muted)":"#8a5a06";
    return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 40 40" aria-hidden="true">'+
      '<path d="M12 5h16v9a8 8 0 0 1-16 0V5z" fill="'+cup+'" stroke="'+line+'" stroke-width="1.6" stroke-linejoin="round"/>'+
      '<path d="M28 7h4v3a5 5 0 0 1-5 5M12 7H8v3a5 5 0 0 0 5 5" fill="none" stroke="'+line+'" stroke-width="1.6" stroke-linecap="round"/>'+
      '<path d="M20 22v6M14 34h12M16 34l1-6h6l1 6" fill="'+cup+'" stroke="'+line+'" stroke-width="1.6" stroke-linejoin="round"/>'+
      (locked?'':'<path d="M15.5 10.5l2-2.5h5l2 2.5-4.5 6z" fill="'+color+'" stroke="#161e27" stroke-width=".8" stroke-linejoin="round"/>'+
        '<path d="M15.5 10.5h9M17.5 8l1.5 2.5 1 6M22.5 8 21 10.5l-1 6" fill="none" stroke="rgba(255,255,255,.75)" stroke-width=".6"/>')+
      '</svg>';
  }
  function trophies(){
    const total=totalWords(), rs=runs(), cur=streak();
    const wordCount=Math.floor(total/5000);
    // silver: every 5,000 words overall. gold: every 5,000 words written inside one unbroken streak
    let gold=0, runWords=0, prev=null; const runTotals=[];
    const close=()=>{ if(runWords>0){ gold+=Math.floor(runWords/5000); runTotals.push(runWords); } runWords=0; };
    for(const k of Object.keys(days).sort()){
      if(k>todayK) break;
      if(k===todayK && !met(k)) break;           // today isn't done yet; it can't break the streak
      if((prev && diff(prev,k)!==1) || !met(k)) close();
      if(met(k)) runWords+=W(k);
      prev=k;
    }
    const lastMet = met(todayK) ? todayK : key(addDays(today,-1));
    const alive = prev && prev===lastMet && met(prev);
    const liveWords = alive ? runWords : 0;
    close();
    runWords = liveWords;
    const gems=GEMS.map(g=>({...g, count:runTotals.filter(w=>w>=g.at).length}));
    const streakWords = cur>0 ? runWords : 0;          // words in the streak that's still alive
    const goldInto = streakWords%5000;
    const streaks=STREAK_TROPHIES.map(([n,name])=>({n,name,count:rs.filter(r=>r>=n).length}));
    const best=rs.length?Math.max(...rs):0;
    const next=STREAK_TROPHIES.find(([n])=>n>cur) || STREAK_TROPHIES[STREAK_TROPHIES.length-1];
    const drafts=settings.projects.filter(p=>p.draftDoneAt).length, revs=settings.projects.filter(p=>p.revDoneAt).length;
    const nextGem=GEMS.find(g=>g.at>streakWords)||null;
    return {total, wordCount, gold, silver:wordCount, streakWords, goldInto, gems, nextGem, nextWords:(wordCount+1)*5000, streaks, best, cur, next, drafts, revs,
      earned: wordCount + gold + gems.reduce((s,g)=>s+g.count,0) + streaks.reduce((s,x)=>s+x.count,0) + drafts + revs};
  }
  const earnedKeys = () => { const t=trophies(); return ["w"+t.wordCount].concat(t.streaks.map(s=>s.n+":"+s.count)); };

  // ---------- theme by time of day ----------
  function themePref(){ try{ return localStorage.getItem("dwl-theme")||"auto"; }catch(_){ return "auto"; } }
  function isNight(){
    const p=themePref(); if(p==="night") return true; if(p==="day") return false;
    const h=new Date().getHours(); return h<6 || h>=19;
  }
  function applyTheme(){ const n=isNight(); document.documentElement.classList.toggle("night", n); const m=$("themeColor"); if(m) m.setAttribute("content", n?"#161e27":"#f3f6fa"); }
  function cycleTheme(){
    const order=["auto","day","night"], p=themePref(), nx=order[(order.indexOf(p)+1)%3];
    try{ localStorage.setItem("dwl-theme",nx); }catch(_){}
    applyTheme(); render();
    toast(nx==="auto" ? "Colors follow the time of day" : nx==="day" ? "Day colors, all the time" : "Night colors, all the time");
  }

  // ---------- views ----------
  function ringSVG(w,g){
    const C=2*Math.PI*88, lap=n=>Math.min(1,Math.max(0,(w-n*g)/g));
    const arc=(f,color)=> f>0 ? '<circle cx="102" cy="102" r="88" fill="none" stroke="'+color+'" stroke-width="18" stroke-linecap="round" stroke-dasharray="'+(f*C).toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 102 102)"/>' : "";
    return '<svg viewBox="0 0 204 204" aria-hidden="true"><circle cx="102" cy="102" r="88" fill="none" stroke="var(--track)" stroke-width="18"/>'+
      arc(lap(0),"var(--blue)")+arc(lap(1),"var(--gold)")+arc(lap(2),"var(--pink)")+'</svg>';
  }
  function tierLine(w,g){

    const col={none:"var(--muted)",part:"var(--muted)",met:"var(--blue-ink)",double:"var(--gold-ink)",beyond:"var(--pink-ink)"}[t];

  }

    const col={none:"var(--muted)",part:"var(--muted)",met:"var(--blue-ink)",double:"var(--gold-ink)",beyond:"var(--pink-ink)"}[tier];

  function miniBar(label,val,goal,color){

  function viewCalendar(){
    const first=new Date(calY,calM,1), dim=new Date(calY,calM+1,0).getDate();
    let cells="", mw=0, mt=0, mm=0, md=0;
    for(let i=0;i<first.getDay();i++) cells+='<span class="day blank"></span>';
    for(let n=1;n<=dim;n++){
      const k=key(new Date(calY,calM,n)), st=status(k), w=W(k), note=days[k]&&days[k].note;
      mw+=w; if(st==="met"||st==="double"||st==="beyond"){mm++;} if(st==="double"||st==="beyond")md++;
      if(["met","double","beyond","part","miss"].includes(st)) mt++;

    '<div class="legend" style="justify-content:flex-start"><span><i class="sw" style="background:var(--blue-tint);border-radius:3px"></i>Some words</span><span><i class="sw" style="background:var(--blue)"></i>Target</span><span><i class="sw" style="background:var(--gold)"></i>Double</span><span><i class="sw" style="background:var(--pink)"></i>Triple+</span><span><i class="sw" style="border:1px dashed var(--muted)"></i>Missed</span></div>'+
    '<div class="band grid3"><div class="stat"><span class="label">This month</span><b style="font-size:19px">'+fmt(mw)+'</b></div>'+

    '<form class="card" id="dayForm" style="display:flex;flex-direction:column;gap:10px">'+
      '<div class="between"><h2>'+DOW[sd.getDay()]+', '+short(calSel)+'</h2><span style="font-size:12px;font-weight:800;color:'+stCol+'">'+stName+'</span></div>'+
      '<div class="row" style="align-items:flex-end"><label for="dayWords" style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px"><span class="label">Word total for this day</span>'+

        '<div class="row"><label for="dayCh" style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px"><span class="label">Chapters revised</span><input id="dayCh" class="field mono" type="number" min="0" inputmode="numeric" placeholder="0" value="'+(d&&d.chapters?d.chapters:"")+'"></label>'+
        '<label for="dayCut" style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px"><span class="label">Words cut</span><input id="dayCut" class="field mono" type="number" min="0" inputmode="numeric" placeholder="0" value="'+(d&&d.cut?d.cut:"")+'"></label></div>' : '')+

  function viewProjects(){
    const pt=projTotals(), yt=projTotals(String(today.getFullYear()));
    const rank=p=>p.id===settings.current?0:(p.stage==="Done"?2:1);
    const list=settings.projects.slice().sort((a,b)=>rank(a)-rank(b));
    let cards=list.map(p=>{
      if(editingProj===p.id) return projForm(p);
      const tot=pt[p.id]||0, pace=projPace(p.id), cur=p.id===settings.current;
      if(completing && completing.id===p.id) return completeCard(p,tot);
      if(p.stage==="Done") return doneCard(p,tot);
      if(!cur) return compactCard(p,tot);
      if(p.stage==="Revising") return revCard(p,tot,cur);
      let status="";
      if(p.target>0){
        const left=p.target-tot;
        if(left<=0) status='<span style="font-size:12px;font-weight:800;color:var(--blue-ink)">Target reached</span>';
        else if(p.deadline && p.deadline>=todayK){
          const need=left/(diff(todayK,p.deadline)+1);
          const ok=pace>=need;
          status='<span style="font-size:12px;font-weight:800;color:'+(ok?"var(--blue-ink)":"var(--pink-ink)")+'">'+(ok?"On track for "+short(p.deadline):"Needs "+fmt(need)+"/day to make "+short(p.deadline))+'</span>';
        } else if(p.deadline) status='<span style="font-size:12px;font-weight:800;color:var(--pink-ink)">Deadline '+short(p.deadline)+' has passed</span>';
      }
      let finish="–";
      if(p.target>0 && pace>0 && tot<p.target){ const f=addDays(today,Math.ceil((p.target-tot)/pace)); finish=short(key(f))+(f.getFullYear()!==today.getFullYear()?" "+String(f.getFullYear()).slice(2):""); }
      else if(p.target>0 && tot>=p.target) finish="Done";
      return '<div class="card proj'+(cur?" current":"")+'">'+
        '<div class="between">'+(cur?'<span class="chip">WRITING ON</span>':'<span></span>')+'<span class="muted" style="font-size:12px">'+esc(p.stage)+'</span></div>'+
        '<div class="between" style="align-items:flex-start"><h2 style="font-size:'+(cur?20:17)+'px">'+esc(p.name)+'</h2><button class="iconbtn" style="width:36px;height:36px" data-act="editproj" data-v="'+esc(p.id)+'" aria-label="Edit '+esc(p.name)+'">'+ICON.edit+'</button></div>'+
        '<div class="row" style="align-items:baseline"><b class="mono" style="font-size:'+(cur?28:20)+'px;font-weight:600;line-height:1">'+fmt(tot)+'</b><span class="mono muted" style="font-size:13px">'+(p.target>0?"/ "+fmt(p.target)+" · "+Math.floor(100*tot/p.target)+"%":"words · no target set")+'</span></div>'+
        (p.target>0?'<div class="bar" style="height:8px"><span style="width:'+Math.min(100,100*tot/p.target)+'%"></span></div>':'')+
        (p.target>0?'<div class="grid3"><div class="stat"><span class="sub muted">pace</span><b style="font-size:14px">'+(pace?fmt(pace)+"/day":"–")+'</b></div><div class="stat"><span class="sub muted">done around</span><b style="font-size:14px">'+finish+'</b></div><div class="stat"><span class="sub muted">deadline</span><b style="font-size:14px">'+(p.deadline?short(p.deadline):"–")+'</b></div></div>':'')+
        status+
        '<div class="row" style="flex-wrap:wrap">'+(!cur?'<button class="btn" data-act="setcur" data-v="'+esc(p.id)+'">Write on this</button>':'')+
        (p.stage==="Planning"||p.stage==="Drafting"?'<button class="btn" data-act="complete" data-v="'+esc(p.id)+'">Mark draft complete</button>':
         '<button class="btn" data-act="finish" data-v="'+esc(p.id)+'">Mark finished</button>')+'</div>'+
      '</div>';
    }).join("");
    if(editingProj==="new") cards=projForm(null)+cards;
    const yw=Object.values(yt).reduce((a,b)=>a+b,0);
    const colors=["var(--blue)","var(--gold)","var(--pink)","#7c8cff","#3fc7ac","#b38cff"];
    let seg="", leg="";
    settings.projects.forEach((p,i)=>{ const v=yt[p.id]||0; if(!v) return; const c=colors[i%colors.length]; seg+='<span style="flex:'+v+' 1 0;background:'+c+'"></span>'; leg+='<span><i class="sw" style="background:'+c+'"></i>'+esc(p.name)+'</span>'; });
    const other=Object.keys(yt).filter(k=>!settings.projects.some(p=>p.id===k)).reduce((s,k)=>s+yt[k],0);
    if(other){ seg+='<span style="flex:'+other+' 1 0;background:var(--band-track)"></span>'; leg+='<span><i class="sw" style="background:var(--band-track)"></i>No project</span>'; }
    return ''+
    '<div class="between"><div><div class="eyebrow">PROJECTS</div><h1>Your manuscripts</h1></div>'+
      '<button class="btn primary" data-act="newproj" style="padding:0 14px">+ New</button></div>'+
    (cards || '<button class="add-slot" data-act="newproj"><span>Add your first project</span><span class="muted" style="font-size:12px;font-weight:500">A title, a word target and an optional deadline</span></button>')+
    (yw?'<div class="band" style="display:flex;flex-direction:column;gap:6px;padding:10px 14px"><span class="label">'+today.getFullYear()+' words by project</span><div style="display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px">'+seg+'</div><div class="legend" style="justify-content:flex-start;color:var(--band-muted)">'+leg+'</div></div>':'')+
    backupCard();

  function backupCard(){
    const last=(()=>{ try{ return localStorage.getItem("dwl-last-backup"); }catch(_){ return null; } })();
    if(pendingRestore){
      const n=Object.keys(pendingRestore.days||{}).length;
      return '<div class="card" style="display:flex;flex-direction:column;gap:10px;border:1.5px solid var(--pink)"><h2>Restore this backup?</h2>'+
        '<p class="muted" style="margin:0;font-size:13px">It has '+n+' logged day'+(n===1?"":"s")+(pendingRestore.exported?', saved '+short(pendingRestore.exported.slice(0,10)):"")+'. It replaces everything currently in Momentum on this device.</p>'+
        '<div class="row"><button class="btn primary" data-act="confirmrestore">Restore</button><button class="btn quiet" data-act="cancelrestore">Cancel</button></div></div>';
    }
    return '<div class="card mini push"><div class="between"><span><b style="font-size:14px">Backup</b> <span class="muted" style="font-size:12px">· '+(last?"saved "+short(last):"not saved yet")+'</span></span>'+
      '<span class="row" style="gap:4px"><button class="btn" style="height:32px;padding:0 10px;font-size:13px" data-act="backup">Save</button>'+
      '<label class="btn quiet" style="height:32px;padding:0 6px;font-size:13px;display:inline-flex;align-items:center;cursor:pointer">Restore<input id="restoreFile" type="file" accept="application/json,.json" hidden></label></span></div></div>';
  }
  function projHead(p,cur){
    return '<div class="between">'+(cur?'<span class="chip">WRITING ON</span>':'<span></span>')+'<span class="muted" style="font-size:12px">'+esc(p.stage)+'</span></div>'+
      '<div class="between" style="align-items:flex-start"><h2 style="font-size:'+(cur?20:17)+'px">'+esc(p.name)+'</h2><button class="iconbtn" style="width:36px;height:36px" data-act="editproj" data-v="'+esc(p.id)+'" aria-label="Edit '+esc(p.name)+'">'+ICON.edit+'</button></div>';
  }
  function compactCard(p,tot){
    let line, bar="";
    if(p.stage==="Revising" && p.revision){
      const rv=projRev(p.id);
      line='Cut '+fmt(rv.cut)+(p.revision.cutGoal?' / '+fmt(p.revision.cutGoal):'')+' · Chapters '+rv.ch+(p.revision.chapterGoal?' / '+p.revision.chapterGoal:'');
      if(p.revision.chapterGoal) bar='<div class="bar"><span style="width:'+Math.min(100,100*rv.ch/p.revision.chapterGoal)+'%;background:var(--gold)"></span></div>';
    } else if(p.stage==="Revising"){ line=fmt(p.draftWords||tot)+' words · revision goals not set'; }
    else { line=fmt(tot)+(p.target>0?' / '+fmt(p.target)+' words':' words'); if(p.target>0) bar='<div class="bar"><span style="width:'+Math.min(100,100*tot/p.target)+'%"></span></div>'; }
    return '<div class="card mini">'+
      '<div class="between"><b style="font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(p.name)+'</b><span class="muted" style="font-size:12px;flex:0 0 auto">'+esc(p.stage)+'</span></div>'+
      '<div class="between"><span class="mono muted" style="font-size:12px">'+line+'</span>'+
        '<span class="row" style="flex:0 0 auto;gap:4px"><button class="btn" style="height:32px;padding:0 10px;font-size:13px" data-act="setcur" data-v="'+esc(p.id)+'">'+(p.stage==="Revising"?"Revise":"Write")+'</button>'+
        '<button class="iconbtn" style="width:32px;height:32px" data-act="editproj" data-v="'+esc(p.id)+'" aria-label="Edit '+esc(p.name)+'">'+ICON.edit+'</button></span></div>'+
      bar+'</div>';
  }
  function revCard(p,tot,cur){
    const R_=p.revision, rv=projRev(p.id), start=p.draftWords||tot;
    let body;
    if(!R_){
      body='<p class="muted" style="margin:0;font-size:13px">'+fmt(start)+' words in the draft. Set goals for words to cut and chapters to revise to track this revision.</p>'+
        '<button class="btn primary" data-act="revgoals" data-v="'+esc(p.id)+'">Set revision goals</button>';
    } else {
      const chLeft=Math.max(0,R_.chapterGoal-rv.ch);
      let fin="–"; if(R_.chapterGoal>0 && chLeft===0) fin="Done"; else if(rv.chPace>0 && chLeft>0){ const f=addDays(today,Math.ceil(chLeft/rv.chPace)); fin=short(key(f))+(f.getFullYear()!==today.getFullYear()?" "+String(f.getFullYear()).slice(2):""); }
      const cutPct=R_.cutGoal>0?Math.min(100,100*rv.cut/R_.cutGoal):0, chPct=R_.chapterGoal>0?Math.min(100,100*rv.ch/R_.chapterGoal):0;
      body='<div class="row" style="align-items:baseline"><b class="mono" style="font-size:'+(cur?28:20)+'px;font-weight:600;line-height:1">'+fmt(Math.max(0,start-rv.cut))+'</b><span class="mono muted" style="font-size:13px">words now · draft '+fmt(start)+'</span></div>'+
        '<div class="between" style="font-size:13px"><span>Words cut</span><span class="mono muted">'+fmt(rv.cut)+(R_.cutGoal?' / '+fmt(R_.cutGoal)+' · '+Math.floor(cutPct)+'%':'')+'</span></div>'+
        '<div class="bar" style="height:8px"><span style="width:'+cutPct+'%;background:var(--pink)"></span></div>'+
        '<div class="between" style="font-size:13px"><span>Chapters revised</span><span class="mono muted">'+rv.ch+(R_.chapterGoal?' / '+R_.chapterGoal+' · '+Math.floor(chPct)+'%':'')+'</span></div>'+
        '<div class="bar" style="height:8px"><span style="width:'+chPct+'%;background:var(--gold)"></span></div>'+
        '<div class="grid3"><div class="stat"><span class="sub muted">pace</span><b style="font-size:14px">'+(rv.chPace?(rv.chPace*7).toFixed(1)+" ch/wk":"–")+'</b></div>'+
        '<div class="stat"><span class="sub muted">done around</span><b style="font-size:14px">'+fin+'</b></div>'+
        '<div class="stat"><span class="sub muted">daily target</span><b style="font-size:12px;font-family:var(--sans)">'+(revTarget(p)?targetText(revTarget(p)):"–")+'</b></div></div>'+
        '<div class="row" style="flex-wrap:wrap">'+(!cur?'<button class="btn" data-act="setcur" data-v="'+esc(p.id)+'">Revise this</button>':'')+
        '<button class="btn" data-act="finishrev" data-v="'+esc(p.id)+'">Revision complete</button>'+
        '<button class="btn quiet" data-act="revgoals" data-v="'+esc(p.id)+'">Goals</button></div>';
    }
    return '<div class="card proj'+(cur?" current":"")+'">'+projHead(p,cur)+body+'</div>';
  }
  function doneCard(p,tot){

      '<span class="muted" style="font-size:12px">'+fmt(p.draftWords||tot)+' words'+(bits.length?' · '+bits.join(", "):'')+(p.completedAt?' · finished '+short(p.completedAt):'')+'</span></div>';
  }
  function completeCard(p,tot){

      '<h2>'+esc(p.name)+'</h2><p class="muted" style="margin:0;font-size:13px">'+fmt(tot)+' words. What\'s next?</p>'+

      '<span class="full label" style="margin-top:4px">Daily target (either one keeps your streak)</span>'+
      '<label><span class="muted" style="font-size:12px">Chapters a day</span><input id="rgDCh" class="field mono" type="number" min="0" inputmode="numeric" value="'+(r.dailyChapters||"")+'"></label>'+
      '<label><span class="muted" style="font-size:12px">or words cut a day</span><input id="rgDCut" class="field mono" type="number" min="0" step="50" inputmode="numeric" value="'+(r.dailyCut||"")+'"></label>'+
      '<div class="full row"><button class="btn primary" type="submit">'+(p.stage==="Revising"?"Save goals":"Start revising")+'</button><button class="btn quiet" type="button" data-act="cancelcomplete">Cancel</button></div>'+
    '</form>';
  }

      '<label><span class="label">Stage</span><select id="pfStage" class="field">'+STAGES.map(s=>'<option'+(s===p.stage?" selected":"")+'>'+s+'</option>').join("")+'</select></label>'+
      '<label><span class="label">Target words</span><input id="pfTarget" class="field mono" type="number" min="0" step="1000" inputmode="numeric" placeholder="80000" value="'+(p.target||"")+'"></label>'+
      '<label class="full"><span class="label">Deadline (optional)</span><input id="pfDue" class="field" type="date" value="'+esc(p.deadline||"")+'"></label>'+

    const shelf=t.streaks.map(s=>'<div class="tro'+(s.count?" got":"")+'" role="button" tabindex="0" data-act="tro" data-v="streak:'+s.n+'">'+CUP.replace('width="24" height="24"','width="20" height="20"')+'<b>'+s.name+'</b><span>'+(s.count?'×'+s.count:s.n+' days')+'</span></div>').join("");
    const nx=t.next, nxPct=Math.min(100,100*t.cur/nx[0]);

    '<div class="between" style="align-items:flex-end"><div><div class="eyebrow">TROPHIES</div><h1>Trophy shelf</h1></div><span class="muted" style="font-size:13px">'+t.earned+' earned</span></div>'+
    '<div class="band" style="display:flex;flex-direction:column;gap:6px;padding:12px 14px">'+
      '<span class="label">Word trophies</span>'+
      '<div class="grid3" style="grid-template-columns:1fr 1fr;align-items:center">'+
        '<div class="medal" role="button" tabindex="0" data-act="tro" data-v="silver"><i style="background:var(--silver)">'+CUP.replace('width="24" height="24"','width="28" height="28" stroke="#161e27"')+'</i><div class="stat"><b>×'+t.silver+'</b><span class="sub" style="font-size:12px">silver · every 5,000</span></div></div>'+
        '<div class="medal" role="button" tabindex="0" data-act="tro" data-v="gold"><i style="background:var(--gold)">'+CUP.replace('width="24" height="24"','width="28" height="28" stroke="#161e27"')+'</i><div class="stat"><b>×'+t.gold+'</b><span class="sub" style="font-size:12px">gold · 5,000 in one streak</span></div></div>'+
      '</div>'+
      '<div class="between" style="font-size:12px"><span>Next silver: '+fmt(t.nextWords)+' total</span><span class="mono sub">'+fmt(t.nextWords-t.total)+' to go</span></div>'+
      '<div class="gold-bar" style="height:6px;background:var(--band-track)"><span style="width:'+(100*into/5000)+'%;background:var(--silver)"></span></div>'+
      '<div class="between" style="font-size:12px"><span>Next gold: this streak</span><span class="mono sub">'+(t.cur?fmt(t.goldInto)+' / 5,000':'start a streak')+'</span></div>'+
      '<div class="gold-bar" style="height:6px;background:var(--band-track)"><span style="width:'+(100*t.goldInto/5000)+'%"></span></div>'+
    '</div>'+
    '<div class="between"><span class="label">Gems · words in one streak</span><span class="muted" style="font-size:12px">'+(t.nextGem?(t.cur?fmt(t.streakWords)+' / '+fmt(t.nextGem.at)+' for '+t.nextGem.name:'start a streak'):'all gems earned')+'</span></div>'+
    '<div class="gems">'+t.gems.map(g=>'<div class="gem'+(g.count?' got':'')+'" role="button" tabindex="0" data-act="tro" data-v="gem:'+g.at+'" title="'+g.name+': '+fmt(g.at)+' words in one unbroken streak">'+gemCup(g.color,36,!g.count)+
      '<b>'+g.name+'</b><span>'+(g.count?'×'+g.count:fmt(g.at/1000)+'K')+'</span></div>').join("")+'</div>'+
    '<div class="between"><span class="label">Streaks &amp; milestones</span><span class="muted" style="font-size:12px">current '+t.cur+' · best '+t.best+'</span></div>'+
    '<div class="shelf">'+shelf+
      '<div class="tro'+(t.drafts?" got":"")+'" role="button" tabindex="0" data-act="tro" data-v="draft">'+CUP.replace('width="24" height="24"','width="20" height="20"')+'<b>Draft done</b><span>'+(t.drafts?'×'+t.drafts:'not yet')+'</span></div>'+
      '<div class="tro'+(t.revs?" got":"")+'" role="button" tabindex="0" data-act="tro" data-v="rev">'+CUP.replace('width="24" height="24"','width="20" height="20"')+'<b>Revision done</b><span>'+(t.revs?'×'+t.revs:'not yet')+'</span></div>'+
    '</div>'+
    '<div class="card" style="display:flex;flex-direction:column;gap:6px;padding:10px 12px"><div class="between" style="font-size:13px"><b>Next: '+(t.cur>=365?"another Year":nx[1])+'</b><span class="mono muted">'+t.cur+' / '+nx[0]+' days</span></div><div class="bar"><span style="width:'+nxPct+'%"></span></div>'+
    '<span class="muted" style="font-size:12px">A missed day resets the streak. Earned trophies stay.</span></div>';
  }

  function sheetHTML(){
    const R={week:["Past week",rate("week")],month:["Past 30 days",rate("month")],year:[today.getFullYear()+" so far",rate("year")]};
    const s=R[sheetRange][1];
    const segs=Object.keys(R).map(k=>'<button class="seg" data-act="range" data-v="'+k+'" aria-pressed="'+(k===sheetRange)+'"><span>'+R[k][0]+'</span><b>'+(R[k][1].pct==null?"–":R[k][1].pct+"%")+'</b></button>').join("");
    return '<button class="away" data-act="closesheet" aria-label="Close"></button>'+
    '<div class="panel" role="dialog" aria-label="On-target rates">'+
      '<span class="grab"></span>'+
      '<div class="between"><div><h2 style="font-size:20px">On target</h2><span class="muted" style="font-size:13px">Days you hit your daily target</span></div><button class="iconbtn" data-act="closesheet" aria-label="Close">'+ICON.close+'</button></div>'+
      '<div class="grid3">'+segs+'</div>'+
      (s.days ?
        '<div class="between" style="align-items:flex-end"><b class="mono" style="font-size:60px;font-weight:600;line-height:.95;color:var(--blue-ink)">'+s.pct+'%</b><span class="muted" style="font-size:14px;text-align:right">'+s.met+' of '+s.days+' days<br>'+short(s.from)+' – '+short(s.to)+'</span></div>'+
        '<div class="bar" style="height:10px"><span style="width:'+s.pct+'%"></span></div>'+
        '<div class="grid3"><div class="tint" style="background:var(--blue-tint)"><span style="color:var(--blue-ink)">Target met</span><b>'+s.met+'</b></div>'+
        '<div class="tint" style="background:var(--gold-tint)"><span style="color:var(--gold-ink)">Doubled</span><b>'+s.dbl+'</b></div>'+
        '<div class="tint" style="background:var(--pink-tint)"><span style="color:var(--pink-ink)">Triple+</span><b>'+s.bey+'</b></div></div>'
      : '<p class="muted" style="margin:0">No finished days in this range yet. Log today to start the count.</p>')+
      '<span class="muted" style="font-size:13px">Current streak '+streak()+' days · Best '+trophies().best+' days</span>'+
    '</div>';
  }

  // ---------- render + routing ----------
  const TABS=[["today","Today"],["calendar","Calendar"],["projects","Projects"],["trophies","Trophies"]];
  function render(){
    const scroll=$("view").scrollTop, same=$("view").dataset.v===view;
    $("view").innerHTML = view==="calendar"?viewCalendar():view==="projects"?viewProjects():view==="trophies"?viewTrophies():viewToday();
    $("view").dataset.v=view; if(same) $("view").scrollTop=scroll;
    $("tabs").innerHTML=TABS.map(([v,l])=>'<button data-act="go" data-v="'+v+'"'+(v===view?' aria-current="page"':'')+'>'+ICON[v]+l+'</button>').join("");
    if(!$("sheet").hidden) $("sheet").innerHTML = sheetKind==="rates" ? sheetHTML() : troSheet(sheetKind);
    fitRing();
  }
  // size the ring to fill whatever height is left on Today, so the screen fits without scrolling or gaps
  function spare(){
    const v=$("view"), kids=[...v.children].filter(k=>!k.classList.contains("push"));
    const last=kids[kids.length-1], pb=parseFloat(getComputedStyle(v).paddingBottom)||0, gap=parseFloat(getComputedStyle(v).rowGap)||0;
    const pushH=[...v.children].filter(k=>k.classList.contains("push")).reduce((s,k)=>s+k.offsetHeight+gap,0);
    return Math.floor(v.clientHeight - (last.getBoundingClientRect().bottom - v.getBoundingClientRect().top + v.scrollTop + pb + pushH));
  }
  function fitRing(){
    const v=$("view"); if(!v.lastElementChild) return;
    if(view==="today"){
      const ring=document.querySelector(".ring"); if(!ring) return;
      ring.style.width="120px"; ring.style.width=Math.max(120,Math.min(240,120+spare()))+"px";
    } else if(view==="calendar"){
      const cal=document.querySelector(".cal"); if(!cal) return;
      const rows=Math.ceil(cal.children.length/7), first=cal.querySelector(".day:not(.blank)")||cal.firstElementChild;
      cal.style.setProperty("--cell","30px");
      const w=first.getBoundingClientRect().width, h=30+Math.floor(spare()/rows);
      cal.style.setProperty("--cell",Math.max(30,Math.min(w,h))+"px");
    } else if(view==="trophies"){
      const sh=document.querySelector(".shelf"); if(!sh) return;
      sh.style.setProperty("--tile","64px");
      const h0=Math.max(64,...[...sh.children].map(t=>t.offsetHeight));
      sh.style.setProperty("--tile",h0+"px");
      sh.style.setProperty("--tile",Math.max(h0,Math.min(200,h0+Math.floor(spare()/2)))+"px");
    }
  }
  window.addEventListener("resize",fitRing);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(fitRing);
  function go(v){ if(!TABS.some(t=>t[0]===v)) v="today"; view=v; editingProj=null; armedDelete=false; $("sheet").hidden=true; try{ if(location.hash!=="#"+v) history.replaceState(null,"","#"+v); }catch(_){ } render(); $("view").scrollTop=0; }
  window.addEventListener("hashchange",()=>{ const v=location.hash.slice(1); if(v&&v!==view) go(v); });

  let tt; function toast(t){ const el=$("toast"); el.textContent=t; el.hidden=false; clearTimeout(tt); tt=setTimeout(()=>el.hidden=true,3500); }

  // ---------- actions ----------
  async function saveDay(k, patch, msg){
    const before=earnedKeys().join("|"), prevBest=trophies();
    const d=Object.assign({words:0, goal:G(k), project:settings.current, note:"", cut:0, chapters:0, rev:null}, days[k]||{}, patch);
    if(!days[k]) d.goal=settings.goal;
    days[k]=d; render();
    try{ await store.saveDay(k,d); }catch(e){ toast("Couldn't save. Check your connection and try again."); return; }
    const after=trophies();
    const newGem=after.gems.find((g,i)=>g.count>prevBest.gems[i].count);
    if(newGem) toast(newGem.name+" trophy! "+fmt(newGem.at)+" words in one unbroken streak");
    else if(after.gold>prevBest.gold) toast("Gold trophy! 5,000 words in one unbroken streak");
    else if(after.wordCount>prevBest.wordCount) toast("Silver trophy! You passed "+fmt(after.wordCount*5000)+" words");
    else { const s=after.streaks.find((x,i)=>x.count>prevBest.streaks[i].count); if(s) toast("Trophy! "+s.name+" streak: "+s.n+" days in a row"); else if(msg) toast(msg); }
  }
  async function clearDay(k){ delete days[k]; render(); try{ await store.clearDay(k); toast("Day cleared"); }catch(_){ toast("Couldn't clear that day. Try again."); } }
  async function saveSettings(msg){ render(); try{ await store.saveSettings(settings); if(msg) toast(msg); }catch(_){ toast("Couldn't save that change. Try again."); } }

  document.addEventListener("click", e=>{
    const b=e.target.closest("[data-act]"); if(!b) return;
    const a=b.dataset.act, v=b.dataset.v;
    if(a==="go") go(v);
    else if(a==="theme") cycleTheme();
    else if(a==="tro"){ sheetKind=v; $("sheet").hidden=false; $("sheet").innerHTML=troSheet(v); const c=$("sheet").querySelector(".iconbtn"); if(c) c.focus(); }
    else if(a==="sheet"){ sheetKind="rates"; $("sheet").hidden=false; $("sheet").innerHTML=sheetHTML(); const c=$("sheet").querySelector(".iconbtn"); if(c) c.focus(); }
    else if(a==="closesheet"){ $("sheet").hidden=true; }
    else if(a==="range"){ sheetRange=v; $("sheet").innerHTML=sheetHTML(); }
    else if(a==="pick"){ calSel=v; render(); }
    else if(a==="month"){ calM+=+v; if(calM<0){calM=11;calY--;} if(calM>11){calM=0;calY++;} render(); }
    else if(a==="clearday") clearDay(calSel);
    else if(a==="newproj"){ editingProj="new"; armedDelete=false; render(); const f=$("pfName"); if(f) f.focus(); }
    else if(a==="editproj"){ editingProj=v; armedDelete=false; render(); }
    else if(a==="cancelproj"){ editingProj=null; armedDelete=false; render(); }
    else if(a==="delproj"){
      if(!armedDelete){ armedDelete=true; render(); return; }
      settings.projects=settings.projects.filter(p=>p.id!==v);
      if(settings.current===v) settings.current=settings.projects[0]?settings.projects[0].id:"";
      editingProj=null; armedDelete=false; saveSettings("Project deleted");
    }
    else if(a==="backup") backup();
    else if(a==="confirmrestore"){
      days={}; const src=pendingRestore.days||{}; for(const k in src) if(/^\d{4}-\d{2}-\d{2}$/.test(k)) days[k]=normDay(src[k]);
      settings=normSettings(pendingRestore.settings); pendingRestore=null; local.persist(); render(); toast("Backup restored");
    }
    else if(a==="cancelrestore"){ pendingRestore=null; render(); }
    else if(a==="complete"){ completing={id:v,kind:"draft"}; render(); }
    else if(a==="torevision"){ completing.kind="rev"; render(); }
    else if(a==="revgoals"){ if(view!=="projects") go("projects"); completing={id:v,kind:"rev"}; render(); }
    else if(a==="finishrev"){ completing={id:v,kind:"revdone"}; render(); }
    else if(a==="cancelcomplete"){ completing=null; render(); }
    else if(a==="finish"||a==="toquery"){
      const p=projOf(v); if(!p) return; const tot=projTotals()[p.id]||0;
      if(p.stage==="Planning"||p.stage==="Drafting"){ p.draftDoneAt=p.draftDoneAt||todayK; p.draftWords=p.draftWords||tot; }
      if(p.stage==="Revising"){ p.revDoneAt=todayK; }
      if(a==="toquery"){ p.stage="Querying"; }
      else { p.stage="Done"; p.completedAt=todayK;
        if(settings.current===p.id){ const nx=settings.projects.find(x=>x.id!==p.id&&x.stage!=="Done"); settings.current=nx?nx.id:""; } }
      completing=null; saveSettings(a==="toquery"?p.name+" is out querying. Good luck!":"Congratulations on finishing "+p.name+"!");
    }
    else if(a==="setcur"){ settings.current=v; saveSettings("Now writing on "+(settings.projects.find(p=>p.id===v)||{}).name); }
  });
  document.addEventListener("keydown", e=>{ const tr=e.target.closest&&e.target.closest('[data-act="tro"]'); if(tr && (e.key==="Enter"||e.key===" ")){ e.preventDefault(); tr.click(); } });
  document.addEventListener("keydown", e=>{ if(e.key==="Escape" && !$("sheet").hidden) $("sheet").hidden=true; });

  document.addEventListener("submit", e=>{
    e.preventDefault();
    const f=e.target;
    if(f.id==="todayForm" && f.dataset.mode==="rev"){
      const cur=projOf(settings.current), rt=revTarget(cur); if(!rt) return;
      const ch=Math.max(0,parseInt($("revCh").value,10)||0), cut=Math.max(0,parseInt($("revCut").value,10)||0);
      if(!ch && !cut){ toast("Enter chapters revised or words cut"); return; }
      const r=revRatio(cut,ch,rt);
      saveDay(todayK,{cut, chapters:ch, project:cur.id, rev:rt}, r>=3?"Saved. Triple+!":r>=2?"Saved. Double target!":r>=1?"Saved. Target met!":"Saved. Goal: "+targetText(rt));
    } else if(f.id==="revGoalForm"){
      const p=projOf(completing&&completing.id); if(!p) return; const tot=projTotals()[p.id]||0;
      const vals={cutGoal:parseInt($("rgCut").value,10)||0, chapterGoal:parseInt($("rgCh").value,10)||0, dailyCut:parseInt($("rgDCut").value,10)||0, dailyChapters:parseInt($("rgDCh").value,10)||0};
      if(!vals.dailyCut && !vals.dailyChapters){ toast("Set a daily target: chapters, words cut, or both"); return; }
      const starting=p.stage!=="Revising";
      if(starting){ if(p.stage==="Planning"||p.stage==="Drafting") p.draftDoneAt=p.draftDoneAt||todayK; p.stage="Revising"; }
      p.draftWords=p.draftWords||tot;
      p.revision=Object.assign({startedAt:(p.revision&&p.revision.startedAt)||todayK}, vals);
      completing=null; saveSettings(starting?p.name+" moved to revision":"Revision goals saved");
    } else if(f.id==="todayForm"){
      const raw=$("todayWords").value.trim(); if(raw===""){ toast("Enter today's word total"); return; }
      const w=Math.max(0,parseInt(raw,10)||0);
      saveDay(todayK,{words:w, project:days[todayK]&&days[todayK].project!==undefined&&days[todayK].words>0?days[todayK].project:settings.current},
        w>=3*settings.goal?"Saved. Triple+!":w>=2*settings.goal?"Saved. Double target!":w>=settings.goal?"Saved. Target met!":"Saved. "+fmt(settings.goal-w)+" to go");
    } else if(f.id==="dayForm"){
      const raw=$("dayWords").value.trim(); const w=raw===""?0:Math.max(0,parseInt(raw,10)||0);
      const pj=$("dayProj").value, prev=days[calSel], patch={words:w, project:pj, note:$("dayNote").value};
      if($("dayCh")){ patch.chapters=Math.max(0,parseInt($("dayCh").value,10)||0); patch.cut=Math.max(0,parseInt($("dayCut").value,10)||0);
        patch.rev=revTarget(projOf(pj)) || (prev&&prev.rev) || null; }
      saveDay(calSel,patch,"Saved "+short(calSel));
    } else if(f.id==="projForm"){
      const name=$("pfName").value.trim(); if(!name) return;
      const vals={name, stage:$("pfStage").value, target:parseInt($("pfTarget").value,10)||0, deadline:$("pfDue").value||""};
      if(editingProj==="new"){ const id="p"+Date.now().toString(36); settings.projects.push(Object.assign({id},vals)); if(!settings.current) settings.current=id; }
      else Object.assign(settings.projects.find(p=>p.id===editingProj),vals);
      const wasNew=editingProj==="new"; editingProj=null; saveSettings(wasNew?"Project added":"Project saved");
    }
  });

  let gt;
  document.addEventListener("input", e=>{
    const t=e.target;
    if(t.id==="todayWords"){ // live preview of the ring before saving
      const w=Math.max(0,parseInt(t.value,10)||0), g=G(todayK);
      $("ringArt").innerHTML=ringSVG(w,g); $("tierLine").innerHTML=tierLine(w,g);
    } else if(t.id==="revCh"||t.id==="revCut"){
      const rt=revTarget(projOf(settings.current)); if(!rt) return;
      const ch=Math.max(0,parseInt($("revCh").value,10)||0), cut=Math.max(0,parseInt($("revCut").value,10)||0);
      $("ringArt").innerHTML=ringSVG(revRatio(cut,ch,rt),1); $("tierLine").innerHTML=revLine(cut,ch,rt);
    } else if(t.id==="goalIn"){
      clearTimeout(gt); gt=setTimeout(()=>{ const g=parseInt(t.value,10); if(!(g>0)||g===settings.goal) return;
        settings.goal=g; if(days[todayK]){ days[todayK].goal=g; store.saveDay(todayK,days[todayK]).catch(()=>{}); }
        saveSettings("Daily target: "+fmt(g)+" words"); },800);
    }
  });
  async function backup(){
    const data={app:"momentum", version:1, exported:new Date().toISOString(), days, settings};
    const name="momentum-backup-"+todayK+".json";
    const file=new File([JSON.stringify(data,null,1)], name, {type:"application/json"});
    const done=()=>{ try{ localStorage.setItem("dwl-last-backup",todayK); }catch(_){} render(); };
    try{
      if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:"Momentum backup"}); done(); toast("Backup saved"); return; }
    }catch(err){ if(err && err.name==="AbortError") return; }
    const url=URL.createObjectURL(file), a=document.createElement("a");
    a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),5000); done(); toast("Backup downloaded");
  }
  document.addEventListener("change", e=>{
    const t=e.target;
    if(t.id==="restoreFile" && t.files && t.files[0]){
      const r=new FileReader();
      r.onload=()=>{ try{ const d=JSON.parse(r.result); if(!d || typeof d.days!=="object") throw 0; pendingRestore=d; render(); }
        catch(_){ toast("That file isn't a Momentum backup"); } };
      r.readAsText(t.files[0]); t.value=""; return;
    }
    if(t.id==="curProj"){ settings.current=t.value; if(days[todayK]){ days[todayK].project=t.value; store.saveDay(todayK,days[todayK]).catch(()=>{}); } saveSettings(); }
  });
  document.addEventListener("focusout", e=>{
    const t=e.target;
    if(t.id==="dayNote"){ const cur=(days[calSel]&&days[calSel].note)||""; if(t.value!==cur) saveDay(calSel,{note:t.value},"Note saved"); }
  });

  // clock: theme + midnight rollover
  setInterval(()=>{
    const wasNight=document.documentElement.classList.contains("night"); applyTheme();
    const n=new Date(); n.setHours(0,0,0,0);
    if(key(n)!==todayK){ if(calSel===todayK) calSel=key(n); today=n; todayK=key(n); render(); }
    else if(wasNight!==isNight()) render();
  },60000);

  // ---------- storage ----------
  const LS="daily-words-ledger";
  const local={
    load(){ try{ const d=JSON.parse(localStorage.getItem(LS)||"null"); if(d){ settings=normSettings(d.settings); const src=d.days||d.entries||{}; for(const k in src) days[k]=normDay(src[k]); } }catch(_){} },
    persist(){ try{ localStorage.setItem(LS,JSON.stringify({days,settings})); }catch(_){} },
    async saveDay(){ local.persist(); }, async clearDay(){ local.persist(); }, async saveSettings(){ local.persist(); }
  };
  applyTheme();
  store=local; local.load(); settings=normSettings(settings);
  go((location.hash||"").slice(1)||"today");

  // keep data from being cleared, and work offline
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(_){}
  if("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
</body>
</html>
